# ============================================================================
# ~/.config/yazi/yazi.toml — Fast Terminal File Manager (Alpine WSL 2)
# ============================================================================
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 1000
max_height      = 1000

[opener]
edit = [
  { run = 'nvim "$@"', desc = "Edit in Neovim", block = true, for = "unix" },
  { run = 'code "$@"', desc = "Open in VS Code (Windows)", orphan = true, for = "unix" },
]
open = [
  { run = 'explorer.exe "$@"', desc = "Open in Windows Explorer", orphan = true, for = "unix" },
]
