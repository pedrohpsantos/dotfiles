# ============================================================
# ~/.config/tmux/tmux.conf — Catppuccin Mocha Tmux Configuration
# ============================================================
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -g default-shell /bin/zsh
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on

# Intuitive split bindings preserving current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Floating TUI Popups (LazyGit, LazyDocker, Yazi, Btop)
bind g display-popup -d "#{pane_current_path}" -w 92% -h 92% -E "lazygit"
bind d display-popup -d "#{pane_current_path}" -w 92% -h 92% -E "lazydocker"
bind y display-popup -d "#{pane_current_path}" -w 92% -h 92% -E "yazi"
bind b display-popup -d "#{pane_current_path}" -w 92% -h 92% -E "btop"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Vi copy-mode & Windows clipboard integration via clip.exe
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"

# Catppuccin Mocha Status Bar
set -g status-position bottom
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left "#[fg=#11111b,bg=#cba6f7,bold]  #S #[fg=#cba6f7,bg=#181825] "
set -g status-left-length 40
set -g status-right "#[fg=#a6adc8]#{b:pane_current_path} #[fg=#45475a]│ #[fg=#f9e2af]%Y-%m-%d #[fg=#a6e3a1,bold]%H:%M "
set -g status-right-length 80
setw -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I:#W "
setw -g window-status-format "#[fg=#a6adc8,bg=#313244] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
