# ============================================================
# ~/.config/starship.toml — Catppuccin Mocha (Alpine WSL 2 Identity)
# ============================================================
palette = "catppuccin_mocha"

format = """
[](sapphire)[ alpine](bg:sapphire fg:crust bold)[](fg:sapphire bg:surface0)[ $username$directory ](bg:surface0 fg:teal bold)[](fg:surface0) \
$git_branch\
$git_status\
$c\
$python\
$nodejs\
$golang\
$rust\
$java\
$docker_context\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 500
scan_timeout = 100

[username]
style_root = "bold red bg:surface0"
style_user = "bold teal bg:surface0"
format = "[$user ]($style)"
show_always = false

[directory]
truncation_length = 4
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style)"
style = "bold teal bg:surface0"
read_only = " "
read_only_style = "bold red bg:surface0"

[git_branch]
symbol = " "
style = "bold sapphire"

[git_status]
style = "bold yellow"

[c]
symbol = " "
style = "bold blue"

[python]
symbol = " "
style = "bold yellow"

[nodejs]
symbol = " "
style = "bold green"

[golang]
symbol = " "
style = "bold teal"

[rust]
symbol = " "
style = "bold peach"

[java]
symbol = " "
style = "bold maroon"

[docker_context]
symbol = " "
style = "bold sky"
only_with_files = true

[kubernetes]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

[cmd_duration]
min_time = 1500
format = "took [$duration]($style) "
style = "bold yellow"

[character]
success_symbol = "[λ](bold teal)"
error_symbol = "[λ](bold red)"
vimcmd_symbol = "[❮](bold sapphire)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"